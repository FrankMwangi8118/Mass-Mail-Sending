<form action="#" th:action="@{/api/email/send}" th:method="post" enctype="multipart/form-data">
    <!-- Input for multiple emails -->
    <input type="text" name="emails" placeholder="Enter emails, separated by commas" required />

    <!-- Input for subject and message body -->
    <input type="text" name="subject" placeholder="Subject" required />
    <textarea name="messageBody" placeholder="Message Body" required></textarea>

    <!-- File input for multiple attachments -->
    <input type="file" name="attachments" multiple />

    <button type="submit">Send Email</button>
</form>
